<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Avior Works builds practical data, analytics, and software solutions for better business decisions.">
  <title>Avior Works — Data, Analytics & Software</title>
  <style>
    :root {
      --bg: #f4f5f6;
      --text: #171a1f;
      --muted: #68717c;
      --line: #dce0e4;
      --accent: #b33a3a;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrap {
      width: min(1080px, calc(100% - 48px));
      margin: 0 auto;
    }
    header {
      height: 88px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .14em;
    }
    .mark {
      width: 10px;
      height: 30px;
      background: var(--accent);
      display: inline-block;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 100px 0 120px;
    }
    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2em;
      margin: 0 0 28px;
    }
    h1 {
      max-width: 760px;
      font-size: clamp(44px, 7vw, 82px);
      line-height: 1.02;
      letter-spacing: -.065em;
      font-weight: 650;
      margin: 0;
    }
    h1 span { color: var(--accent); }
    .intro {
      max-width: 560px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.7;
    }
    .contact {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 38px;
      padding: 15px 0;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      border-bottom: 1px solid var(--accent);
    }
    .contact span { color: var(--accent); font-size: 20px; }
    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    @media (max-width: 600px) {
      .wrap { width: min(100% - 36px, 1080px); }
      header { height: 72px; }
      main { padding: 76px 0 88px; }
      h1 { font-size: clamp(42px, 13vw, 64px); }
      .intro { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand"><span class="mark" aria-hidden="true"></span> AVIOR WORKS</div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <p class="eyebrow">Data · Analytics · Software</p>
      <h1>Turn complexity<br>into <span>clarity.</span></h1>
      <p class="intro">
        We build practical data and software solutions that help businesses
        make better decisions and work smarter.
      </p>
      <a class="contact" href="mailto:hello@aviorworks.com">
        Get in touch <span aria-hidden="true">↗</span>
      </a>
    </div>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>© <span id="year"></span> Avior Works</span>
      <span>Built for better decisions.</span>
    </div>
  </footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
